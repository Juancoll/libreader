name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Web: typecheck + test + build ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ── Linux: Tauri DEB + RPM ──
  linux:
    if: false  # TODO: enable when ready
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - run: bun install --frozen-lockfile

      - name: Tauri build (DEB + RPM)
        run: bunx tauri build --bundles deb,rpm

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 7

  # ── Android: APK + AAB ──
  android:
    if: false  # TODO: enable when Android signing is configured
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set Android env vars
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - run: bun install --frozen-lockfile

      - name: Tauri Android build
        run: bunx tauri android build

      - uses: actions/upload-artifact@v7
        with:
          name: android-bundles
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 7

  # ── iOS: Tauri iOS build (macOS runner) ──
  ios:
    if: false  # TODO: enable when Apple signing is configured
    runs-on: macos-latest
    needs: web
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - run: bun install --frozen-lockfile

      - name: Init Tauri iOS (if needed)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            bunx tauri ios init
          fi

      - name: Tauri iOS build
        run: bunx tauri ios build --export-method app-store-connect
        continue-on-error: true  # iOS build may need signing config

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ios-bundle
          path: src-tauri/gen/apple/build/**/*.ipa
          retention-days: 7
